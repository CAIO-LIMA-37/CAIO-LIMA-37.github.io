<style>
.translate-box {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 0.5rem;
  padding: 0.35rem 1rem 0 1rem;
}

#google_translate_element {
  transform: scale(0.92);
  transform-origin: top right;
}

.goog-te-gadget {
  font-size: 0 !important;
  color: transparent !important;
}

.goog-te-gadget .goog-te-combo {
  background: #111;
  color: #f5f7fa;
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 999px;
  padding: 0.35rem 0.75rem;
  font-size: 0.92rem !important;
}

body.quarto-light .goog-te-gadget .goog-te-combo {
  background: #ffffff;
  color: #1b1f23;
  border: 1px solid rgba(0,0,0,0.14);
}
</style>

<div id="google_translate_element"></div>

<script>
(function () {
  const LANGUAGE_LABELS = {

    el: "Grego",

    ht: "Crioulo haitiano",
    ha: "Hauçá",
    haw: "Havaiano",
    iw: "Hebraico",
    hi: "Hindi",
    hmn: "Hmong",
    hu: "Húngaro",
    is: "Islandês",
    ig: "Igbo",
    id: "Indonésio",
    ga: "Irlandês",
    it: "Italiano",
    ja: "Japonês",
    jw: "Javanês",
    kn: "Canarês",
    kk: "Cazaque",
    km: "Khmer",
    ko: "Coreano",
    ku: "Curdo",
    ky: "Quirguiz",
    lo: "Lao",
    la: "Latim",
    lv: "Letão",
    lt: "Lituano",
    lb: "Luxemburguês",
    mk: "Macedônio",
    mg: "Malgaxe",
    ms: "Malaio",
    ml: "Malaiala",
    mt: "Maltês",
    mi: "Maori",
    mr: "Marati",
    mn: "Mongol",
    my: "Myanmar (birmanês)",
    ne: "Nepalês",
    no: "Norueguês",
    or: "Odia",
    ps: "Pashto",
    fa: "Persa",
    pl: "Polonês",
    pt: "Português",
    pa: "Punjabi",
    ro: "Romeno",
    ru: "Russo",
    sm: "Samoano",
    gd: "Gaélico escocês",
    sr: "Sérvio",
    st: "Sesoto",
    sn: "Shona",
    sd: "Sindi",
    si: "Cingalês",
    sk: "Eslovaco",
    sl: "Esloveno",
    so: "Somali",
    es: "Espanhol",
    su: "Sundanês",
    sw: "Suaíli",
    sv: "Sueco",
    tg: "Tajique",
    ta: "Tamil",
    te: "Telugo",
    th: "Tailandês",
    tr: "Turco",
    uk: "Ucraniano",
    ur: "Urdu",
    ug: "Uyghur",
    uz: "Uzbeque",
    vi: "Vietnamita",
    cy: "Galês",
    xh: "Xhosa",
    yi: "Iídiche",
    yo: "Iorubá",
    zu: "Zulu"
  };

  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {
        pageLanguage: "en",
        autoDisplay: false,
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      },
      "google_translate_element"
    );
  }

  window.googleTranslateElementInit = googleTranslateElementInit;

  function getTargetContainer() {
    return (
      document.querySelector("#quarto-header .navbar-nav.ms-auto") ||
      document.querySelector("#quarto-header .navbar-collapse .navbar-nav.ms-auto") ||
      document.querySelector("#quarto-header .navbar-collapse ul.navbar-nav") ||
      document.querySelector("#quarto-search")?.parentElement ||
      document.querySelector(".navbar .container-fluid") ||
      document.querySelector(".navbar .container")
    );
  }

  function setGoogleLanguage(langCode) {
    const combo = document.querySelector(".goog-te-combo");
    if (!combo) return false;

    const option = Array.from(combo.options).find(opt => opt.value === langCode);
    if (!option) return false;

    combo.value = langCode;
    combo.selectedIndex = option.index;

    combo.dispatchEvent(new Event("change", { bubbles: true }));
    combo.dispatchEvent(new Event("input", { bubbles: true }));
    combo.dispatchEvent(new Event("blur", { bubbles: true }));

    if (typeof combo.onchange === "function") {
      combo.onchange();
    }

    return true;
  }

  function buildLanguagePicker() {
    if (document.querySelector(".custom-language-picker")) return true;

    const target = getTargetContainer();
    if (!target) return false;

    const wrapper = document.createElement("div");
    wrapper.className = "custom-language-picker";
    wrapper.innerHTML = `
      <div class="language-picker">
        <button class="language-picker__trigger" type="button" aria-expanded="false">
          <span class="language-picker__icon">🌐</span>
          <span class="language-picker__label">Language</span>
          <span class="language-picker__caret">⌄</span>
        </button>
        <div class="language-picker__panel" hidden>
          <div class="language-picker__search-wrap">
            <input class="language-picker__search" type="text" placeholder="Search language..." />
          </div>
          <div class="language-picker__list"></div>
        </div>
      </div>
    `;

    const searchBox = document.querySelector("#quarto-search");
    if (searchBox && searchBox.parentElement === target) {
      target.insertBefore(wrapper, searchBox);
    } else {
      target.appendChild(wrapper);
    }

    const picker = wrapper.querySelector(".language-picker");
    const trigger = wrapper.querySelector(".language-picker__trigger");
    const panel = wrapper.querySelector(".language-picker__panel");
    const search = wrapper.querySelector(".language-picker__search");
    const list = wrapper.querySelector(".language-picker__list");
    const label = wrapper.querySelector(".language-picker__label");

    function renderList(filter = "") {
      const q = filter.trim().toLowerCase();
      list.innerHTML = "";

      Object.entries(LANGUAGE_LABELS)
        .sort((a, b) => a[1].localeCompare(b[1], "pt-BR"))
        .filter(([, name]) => name.toLowerCase().includes(q))
        .forEach(([code, name]) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "language-picker__option";
          btn.textContent = name;
          btn.addEventListener("click", () => {
            const ok = setGoogleLanguage(code);
            if (ok) {
              label.textContent = name;
              panel.hidden = true;
              picker.classList.remove("is-open");
              trigger.setAttribute("aria-expanded", "false");
            }
          });
          list.appendChild(btn);
        });
    }

    trigger.addEventListener("click", () => {
      const isOpen = !picker.classList.contains("is-open");
      picker.classList.toggle("is-open", isOpen);
      panel.hidden = !isOpen;
      trigger.setAttribute("aria-expanded", String(isOpen));
      if (isOpen) {
        search.value = "";
        renderList("");
        setTimeout(() => search.focus(), 30);
      }
    });

    search.addEventListener("input", () => renderList(search.value));

    document.addEventListener("click", (e) => {
      if (!wrapper.contains(e.target)) {
        picker.classList.remove("is-open");
        panel.hidden = true;
        trigger.setAttribute("aria-expanded", "false");
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        picker.classList.remove("is-open");
        panel.hidden = true;
        trigger.setAttribute("aria-expanded", "false");
      }
    });

    renderList("");
    return true;
  }

  function bootTranslator(attempt = 0) {
    const combo = document.querySelector(".goog-te-combo");
    const built = document.querySelector(".custom-language-picker");

    if (combo && !built) {
      buildLanguagePicker();
      return;
    }

    if (!combo && attempt < 60) {
      setTimeout(() => bootTranslator(attempt + 1), 500);
      return;
    }

    if (!built) {
      buildLanguagePicker();
    }
  }

  function startWhenReady() {
    setTimeout(() => bootTranslator(0), 400);
    setTimeout(() => buildLanguagePicker(), 1200);
    setTimeout(() => buildLanguagePicker(), 2500);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startWhenReady);
  } else {
    startWhenReady();
  }
})();
</script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>




<script>
document.addEventListener("DOMContentLoaded", function () {
  const aboutEntity = document.querySelector(".about-entity");
  const aboutLinks = document.querySelector(".about-links");

  if (!aboutEntity || !aboutLinks) return;
  if (document.querySelector(".about-contact-card")) return;

  const card = document.createElement("div");
  card.className = "about-contact-card";

  const label = document.createElement("span");
  label.className = "contact-label";
  label.textContent = "Contact Email:";

  const email = document.createElement("span");
  email.className = "contact-email";
  email.textContent = "pedro.canavieira@icen.ufpa.br";

  card.appendChild(label);
  card.appendChild(email);

  aboutLinks.insertAdjacentElement("afterend", card);
});
</script>
