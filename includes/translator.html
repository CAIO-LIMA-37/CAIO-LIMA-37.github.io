<style>
.translate-box {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 0.5rem;
  padding: 0.35rem 1rem 0 1rem;
}

#google_translate_element {
  transform: scale(0.92);
  transform-origin: top right;
}

.goog-te-gadget .goog-te-combo {
  background: #111;
  color: #f5f7fa;
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 999px;
  padding: 0.35rem 0.75rem;
  font-size: 0.92rem !important;
}

body.quarto-light .goog-te-gadget .goog-te-combo {
  background: #ffffff;
  color: #1b1f23;
  border: 1px solid rgba(0,0,0,0.14);
}
</style>

<div class="translate-box">
  <div id="google_translate_element"></div>
</div>

<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    {
      pageLanguage: 'en',
      autoDisplay: false,
      layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL
    },
    'google_translate_element'
  );
}

document.addEventListener("DOMContentLoaded", function () {
  const translateBox = document.querySelector(".translate-box");

  const navbarRight =
    document.querySelector(".navbar .navbar-nav.navbar-nav-scroll.ms-auto") ||
    document.querySelector(".navbar .navbar-nav.ms-auto") ||
    document.querySelector(".navbar .navbar-collapse");

  if (!translateBox || !navbarRight) return;

  if (!navbarRight.contains(translateBox)) {
    navbarRight.appendChild(translateBox);
  }
});
</script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
